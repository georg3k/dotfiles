# Local adaptation; palette: https://rosepinetheme.com/palette/
# Rosé Pine dawn palette: https://rosepinetheme.com/palette/
set -g status-style 'bg=#faf4ed,fg=#575279'
set -g pane-border-style 'fg=#9893a5'
set -g pane-active-border-style 'fg=#907aa9'
set -g message-style 'bg=#faf4ed,fg=#907aa9'
set -g mode-style 'bg=#907aa9,fg=#faf4ed'
set -g window-status-style 'fg=#9893a5'
set -g window-status-current-style 'bg=#907aa9,fg=#faf4ed,bold'
set -g status-left-length 30
set -g status-left '#[bg=#907aa9,fg=#faf4ed,bold] #S #[bg=#faf4ed,fg=#907aa9] '
set -g window-status-format ' #I:#W '
set -g window-status-current-format '#[bg=#907aa9,fg=#faf4ed,bold] #I:#W #[bg=#faf4ed,fg=#907aa9]'
set -g status-right '#[fg=#575279]#{pane_current_command} #[fg=#907aa9]#[bg=#907aa9,fg=#faf4ed] %H:%M '
