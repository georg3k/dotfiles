# Local adaptation; palette: https://rosepinetheme.com/palette/
# Rosé Pine main palette: https://rosepinetheme.com/palette/
set -g status-style 'bg=#191724,fg=#e0def4'
set -g pane-border-style 'fg=#6e6a86'
set -g pane-active-border-style 'fg=#c4a7e7'
set -g message-style 'bg=#191724,fg=#c4a7e7'
set -g mode-style 'bg=#c4a7e7,fg=#191724'
set -g window-status-style 'fg=#6e6a86'
set -g window-status-current-style 'bg=#c4a7e7,fg=#191724,bold'
set -g status-left-length 30
set -g status-left '#[bg=#c4a7e7,fg=#191724,bold] #S #[bg=#191724,fg=#c4a7e7] '
set -g window-status-format ' #I:#W '
set -g window-status-current-format '#[bg=#c4a7e7,fg=#191724,bold] #I:#W #[bg=#191724,fg=#c4a7e7]'
set -g status-right '#[fg=#e0def4]#{pane_current_command} #[fg=#c4a7e7]#[bg=#c4a7e7,fg=#191724] %H:%M '
