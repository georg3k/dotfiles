# CLI tools
{{ if eq .chezmoi.os "linux" }}
[".local/bin/helm"]
type = "archive-file"
{{ $helmVersion := (gitHubLatestRelease "helm/helm").TagName | toString -}}
{{ $helmURL := printf "https://get.helm.sh/helm-%s-linux-%s.tar.gz" $helmVersion .chezmoi.arch -}}
url = {{ $helmURL | quote }}
checksum.sha256 = {{ output "curl" "-fsSL" "--connect-timeout" "15" "--max-time" "120" (printf "%s.sha256sum" $helmURL) | regexFind "^[a-f0-9]{64}" | quote }}
path = "linux-{{ .chezmoi.arch }}/helm"
executable = true

[".local/bin/grpcurl"]
type = "archive-file"
{{ $grpcArch := .chezmoi.arch -}}
{{ if eq $grpcArch "amd64" }}{{ $grpcArch = "x86_64" }}{{ end -}}
{{ includeTemplate "github-asset.toml" (dict "repo" "fullstorydev/grpcurl" "pattern" (printf "grpcurl_*_linux_%s.tar.gz" $grpcArch)) }}
path = "grpcurl"
executable = true

[".local/bin/grpcui"]
type = "archive-file"
{{ includeTemplate "github-asset.toml" (dict "repo" "fullstorydev/grpcui" "pattern" (printf "grpcui_*_linux_%s.tar.gz" $grpcArch)) }}
path = "grpcui"
executable = true

[".local/bin/terragrunt"]
type = "file"
{{ includeTemplate "github-asset.toml" (dict "repo" "gruntwork-io/terragrunt" "pattern" (printf "terragrunt_linux_%s" .chezmoi.arch)) }}
executable = true

[".local/bin/yq"]
type = "file"
{{ includeTemplate "github-asset.toml" (dict "repo" "mikefarah/yq" "pattern" (printf "yq_linux_%s" .chezmoi.arch)) }}
executable = true

{{ end }}

{{ $tools := list "terraform" }}
{{ if eq .chezmoi.os "linux" }}{{ $tools = list "terraform" "terraform-ls" }}{{ end }}
{{ range $tool := $tools }}
[".local/bin/{{ $tool }}"]
type = "archive-file"
{{ $version := (gitHubLatestRelease (printf "hashicorp/%s" $tool)).TagName | toString | trimPrefix "v" -}}
{{ $file := printf "%s_%s_%s_%s.zip" $tool $version $.chezmoi.os $.chezmoi.arch -}}
{{ $base := "https://mirror.selectel.ru/3rd-party/hashicorp-releases" -}}
{{ if ne $.profile "minimal" -}}
{{ $sources := include ".private/sources.age" | decrypt | fromJson -}}
{{ $base = $sources.mirror -}}
{{ end -}}
{{ $mirror := printf "%s/%s/%s" $base $tool $version -}}
url = "{{ $mirror }}/{{ $file }}"
{{ $sums := output "curl" "-fsSL" "--connect-timeout" "15" "--max-time" "120" (printf "%s/%s_%s_SHA256SUMS" $mirror $tool $version) -}}
{{ $line := regexFind (printf "(?m)^[a-f0-9]{64} +%s$" (regexQuoteMeta $file)) $sums -}}
{{ if not $line }}{{ fail (printf "No checksum for %s" $file) }}{{ end -}}
checksum.sha256 = {{ regexFind "^[a-f0-9]{64}" $line | quote }}
path = {{ $tool | quote }}
executable = true
{{ end }}

[".local/bin/jinja-lsp"]
type = "file"
{{ $rustArch := "aarch64" }}{{ if eq .chezmoi.arch "amd64" }}{{ $rustArch = "x86_64" }}{{ end -}}
{{ $rustOS := "unknown-linux-gnu" }}{{ if eq .chezmoi.os "darwin" }}{{ $rustOS = "apple-darwin" }}{{ end -}}
{{ includeTemplate "github-asset.toml" (dict "repo" "uros-5/jinja-lsp" "pattern" (printf "jinja-lsp-%s-%s" $rustArch $rustOS)) }}
executable = true

{{ if ne .profile "minimal" -}}
{{ $privateTargets := include ".private/targets.age" | decrypt | fromJson -}}
{{ range $file := $privateTargets.files -}}
{{ if or (not $file.corporate) (eq $.profile "corporate") }}
[{{ $file.path | quote }}]
type = "file"
url = {{ printf "file://%s/.private/%s.age" $.chezmoi.sourceDir $file.name | quote }}
encrypted = true
private = true
refreshPeriod = "1ns"
{{ end }}
{{ end }}
{{ end -}}
